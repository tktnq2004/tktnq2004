<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><style>text{font-family:'Be Vietnam Pro','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}.mono{font-family:'JetBrains Mono','Cascadia Code',ui-monospace,Consolas,Menlo,monospace}.f-chrome{fill:#e4dfd2}.f-bar{fill:#fbf9f4}.f-field{fill:#ece7dc}.f-paper{fill:#f6f3ec}.f-surface{fill:#fbf9f4}.f-sunk{fill:#efebe1}.f-ink{fill:#1f3d2b}.f-ink2{fill:#3f5446}.f-ink3{fill:#5f6f63}.f-acc{fill:#c4622d}.f-accink{fill:#a64e1f}.f-ok{fill:#2f7d4e}.f-dot{fill:rgba(31,61,43,.22)}.f-onink{fill:#f6f3ec}.s-frame{stroke:#c9c1ae}.s-line{stroke:#ddd7c9}.s-line2{stroke:#cbc4b3}.s-acc{stroke:#c4622d}.s-ink{stroke:#1f3d2b}.s-ink2{stroke:#3f5446}.s-ink3{stroke:#5f6f63}.s-ok{stroke:#2f7d4e}
@media (prefers-color-scheme:dark){.f-chrome{fill:#0c120e}.f-bar{fill:#1b261f}.f-field{fill:#121a15}.f-paper{fill:#121a15}.f-surface{fill:#18221c}.f-sunk{fill:#1d2822}.f-ink{fill:#ebe6d9}.f-ink2{fill:#c6c3b6}.f-ink3{fill:#9da79f}.f-acc{fill:#e2834f}.f-accink{fill:#f09a68}.f-ok{fill:#8fbf96}.f-dot{fill:rgba(160,200,172,.16)}.f-onink{fill:#121a15}.s-frame{stroke:#3a4a3f}.s-line{stroke:#2b382f}.s-line2{stroke:#3a4a3f}.s-acc{stroke:#e2834f}.s-ink{stroke:#ebe6d9}.s-ink2{stroke:#c6c3b6}.s-ink3{stroke:#9da79f}.s-ok{stroke:#8fbf96}}
.prog{opacity:0}
@media (prefers-reduced-motion:no-preference){
.type{transform-box:fill-box;transform-origin:left center;animation:type .9s steps(28,end) .15s both}
.prog{transform-box:fill-box;transform-origin:left center;animation:prog 1.4s ease-out .1s both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes type{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prog{0%{transform:scaleX(0);opacity:1}75%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}}</style><path d="M0.75 -5H999.25V615H0.75Z" class="f-paper s-frame" stroke-width="1.5"/><rect x="40.5" y="0.5" width="919" height="593" rx="14" class="f-surface s-line" stroke-width="1"/><rect x="72.5" y="30.5" width="227" height="26" rx="13" fill="none" class="s-acc" stroke-width="1"/><text x="186" y="48" font-size="12.5" class="f-accink mono" text-anchor="middle">Team project · 2 developers</text><text x="928" y="50" font-size="12.5" class="f-ink3 mono" text-anchor="end">Jun 2026 – now</text><text x="72" y="104" font-size="32" class="f-ink" font-weight="600">Trạm OTA</text><text x="72" y="136" font-size="16" class="f-ink2">Hotel booking platform for Vietnam: map search, 360° room tours, card or bank-transfer QR payments.</text><rect x="72" y="158" width="99" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="121.5" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Next.js 16</text><rect x="179" y="158" width="84" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="221" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">React 19</text><rect x="271" y="158" width="99" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="320.5" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">TypeScript</text><rect x="378" y="158" width="122" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="439" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Spring Boot 4</text><rect x="508" y="158" width="62" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="539" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">MySQL</text><rect x="578" y="158" width="62" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="609" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Redis</text><rect x="648" y="158" width="69" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="682.5" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Docker</text><rect x="725" y="158" width="122" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="786" y="176.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Cloudflare R2</text><rect x="72" y="196" width="69" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="106.5" y="214.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">Stripe</text><rect x="149" y="196" width="62" height="28" rx="14" class="f-sunk s-line" stroke-width="1"/><text x="180" y="214.5" font-size="12.5" class="f-ink2 mono" text-anchor="middle">SePay</text><path d="M72 254.5H928" class="s-line" stroke-width="1"/><text x="72" y="298" font-size="12" class="f-ink3 mono" letter-spacing="0.4">MY PART</text><text x="72" y="332" font-size="24" class="f-ink" font-weight="600">60 / 72</text><text x="172" y="332" font-size="13.5" class="f-ink3">frontend commits</text><text x="308" y="332" font-size="24" class="f-ink" font-weight="600">27 / 101</text><text x="420" y="332" font-size="13.5" class="f-ink3">backend</text><circle cx="75" cy="365.38" r="2.6" class="f-acc"/><text x="88" y="370" font-size="14" class="f-ink2">The booking flow from search to payment, in Vietnamese</text><text x="88" y="392" font-size="14" class="f-ink2">and English, light and dark.</text><circle cx="75" cy="421.38" r="2.6" class="f-acc"/><text x="88" y="426" font-size="14" class="f-ink2">Map search, hotel and room pages, account and wishlist.</text><circle cx="75" cy="455.38" r="2.6" class="f-acc"/><text x="88" y="460" font-size="14" class="f-ink2">The 360° tour editor and the admin and partner back</text><text x="88" y="482" font-size="14" class="f-ink2">offices.</text><circle cx="75" cy="511.38" r="2.6" class="f-acc"/><text x="88" y="516" font-size="14" class="f-ink2">Backend: SePay payments, the partner module, admin vs</text><text x="88" y="538" font-size="14" class="f-ink2">owner/staff permissions, panorama uploads to Cloudflare</text><text x="88" y="560" font-size="14" class="f-ink2">R2, login by one-time code.</text><text x="516" y="298" font-size="12" class="f-ink3 mono" letter-spacing="0.4">PROBLEMS I WORKED THROUGH</text><circle cx="519" cy="327.38" r="2.6" class="f-acc"/><text x="532" y="332" font-size="14" class="f-ink2">Deleting a panorama that other rooms link to returns 409</text><text x="532" y="354" font-size="14" class="f-ink2">with those hotspots, so a tour never ends up with broken</text><text x="532" y="376" font-size="14" class="f-ink2">links.</text><circle cx="519" cy="405.38" r="2.6" class="f-acc"/><text x="532" y="410" font-size="14" class="f-ink2">One login sends each account to /admin or /partner from the</text><text x="532" y="432" font-size="14" class="f-ink2">hotel it belongs to.</text><circle cx="519" cy="461.38" r="2.6" class="f-acc"/><text x="532" y="466" font-size="14" class="f-ink2">Tokens stay in httpOnly cookies behind Next.js route</text><text x="532" y="488" font-size="14" class="f-ink2">handlers; the browser never calls the API directly.</text><circle cx="519" cy="517.38" r="2.6" class="f-acc"/><text x="532" y="522" font-size="14" class="f-ink2">Guest booking with a one-time code: frontend done, backend</text><text x="532" y="544" font-size="14" class="f-ink2">still in progress.</text></svg>
